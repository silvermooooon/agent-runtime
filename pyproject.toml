[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.2.0"
description = "Async Python port of the pi Agent core with provider-aware model options"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/agent_runtime/__init__.py" = ["F401"]
