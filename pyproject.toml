[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.3.0"
description = "Async Python port of the pi Agent core with provider-aware model options"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.28,<0.29",
    "httpx2>=2.5,<3",
    "jsonschema>=4.23,<5",
    "mcp>=2.2,<2.3",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<3.3"]
s3 = ["boto3>=1.36,<2"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/agent_runtime/__init__.py" = ["F401"]
